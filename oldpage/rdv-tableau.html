<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tableau de suivi</title>
  <link rel="stylesheet" href="style.css">

<!-- PAGE TABLEAU : vue desktop des rendez-vous -->

<body>
  <header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">♡</span>YouCanBookMe</a>

  <main class="app-shell content">

    <section class="card sidebar-layout">

              <tr>
                <td>Dr Dupont</td>

              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <!-- Navigation mobile -->
  <nav class="mobile-nav">
    <a class="active nav-btn" href="dashboard.html">Accueil</a>
    <a class="nav-btn" href="appointments.html">Rendez-vous</a>

  </nav>
</body>

</html>
