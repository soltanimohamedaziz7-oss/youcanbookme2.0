<!DOCTYPE html>
<html lang="fr">

<head>

<!-- PAGE DETAIL SOIGNANT : informations d’un professionnel -->

<body>
  <header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">♡</span>YouCanBookMe</a>
    <div class="user-menu"><span class="avatar-mini">👤</span>Bonjour, Sarah⌄</div>

  <main class="app-shell content">
    <a class="back-link" href="mesSoignants.html">‹ Mes soignants</a>

        <div>
          <h2>Dr Martin</h2>
          <p>Médecin généraliste</p>

        <div class="detail-line"><b>Adresse</b><span>12 rue de la Paix, Lyon</span></div>
      </div>
      <!-- Actions disponibles -->
      <div class="detail-footer"><a class="btn btn-outline" href="mesSoignants.html">Retour</a><a class="btn btn-primary"
