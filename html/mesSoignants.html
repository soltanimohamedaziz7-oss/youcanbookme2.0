<!DOCTYPE html>

<!-- PAGE SOIGNANTS : liste des professionnels de santé -->

<body>
  <header class="topbar"><a class="brand" href="dashboard.html"><span class="brand-mark">♡</span>YouCanBookMe</a>
    <div class="user-menu"><span class="avatar-mini"></span>Bonjour, Sarah⌄</div>

  <main class="app-shell content">

    <div class="toolbar">
      <h1 class="page-title">Mes soignants</h1><a href="add-provider.html" class="btn btn-primary">＋ Ajouter un

      </div>
      <div class="provider-row">
        <div class="provider-avatar">♙</div>
        <div class="provider-info"><strong>Dr Dupont</strong><span>Cardiologue</span></div>
        <div class="provider-actions"><a class="icon-btn" href="provider-detail.html">◉</a><a class="icon-btn"
            href="add-provider.html">✎</a><button class="icon-btn red">♜</button><a class="icon-btn blue"
            href="appointments.html"></a><button class="icon-btn yellow">✉</button></div>

      <div class="provider-row">
        <div class="provider-avatar">♙</div>

        <div class="provider-actions"><a class="icon-btn" href="provider-detail.html">◉</a><a class="icon-btn"
            href="add-provider.html">✎</a><button class="icon-btn red">♜</button><a class="icon-btn blue"
            href="appointments.html"></a><button class="icon-btn yellow">✉</button></div>
      </div>
    </section>
  </main>
  <!-- Navigation mobile -->
   <nav class="mobile-nav">
    <a class="active nav-btn" href="dashboard.html">Accueil</a>
    <a class="nav-btn" href="rdvs.html">Rendez-vous</a>
    <a class="nav-btn" href="profil.html">Profil</a>
  </nav>
