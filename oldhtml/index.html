<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>YouCanBookMe - Connexion</title><link rel="stylesheet" href="style.css"></head>
<!-- PAGE CONNEXION : écran d’authentification de l’utilisateur -->
<body>
<!-- Conteneur principal de la page de connexion -->
<div class="login-page">
  <div class="login-box">
    <!-- Partie gauche : identité visuelle et slogan -->
<section class="login-visual">
      <div class="login-logo">♡ YouCanBookMe</div>
      <div class="login-slogan">Prenez soin<br>de votre santé,<br>on s'occupe du reste.</div>
      <small>Mon suivi médical</small>
    </section>
    <!-- Partie droite : formulaire de connexion -->
<section class="login-form">
      <h1>Connexion</h1><p class="intro">Accédez à votre espace personnel</p>
      <div class="form-group"><label>Email</label><div class="input-wrap"><span class="input-icon">✉</span><input class="search" type="email" value="youcanbookme@mail.com"></div></div>
      <div class="form-group"><label>Mot de passe</label><div class="input-wrap"><span class="input-icon">●</span><input class="search" type="password" value="123456789"></div></div>
      <label class="remember"><input type="checkbox" checked> Se souvenir de moi</label>
      <a class="btn btn-primary" href="dashboard.html">Se connecter</a>
      <a class="forgot" href="#">Mot de passe oublié ?</a>
    </section>
  </div>
</div>
</body></html>
